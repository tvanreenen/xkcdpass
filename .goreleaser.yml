version: 2

project_name: xkcdpass

builds:
  - id: xkcdpass
    main: ./cmd/xkcdpass
    binary: xkcdpass
    targets:
      - darwin_arm64
      - linux_amd64_v1
    env:
      - CGO_ENABLED=0
    ldflags:
      - >-
        -s -w -X main.version={{ .Env.XKCDPASS_ARTIFACT_VERSION }}

archives:
  - ids:
      - xkcdpass
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Env.XKCDPASS_ARTIFACT_VERSION }}_{{ .Os }}_{{ .Arch }}
    wrap_in_directory: true
    files:
      - "none*"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  # The workflow validates both versions before passing them to GoReleaser.
  version_template: "{{ .Env.XKCDPASS_GORELEASER_VERSION }}"
